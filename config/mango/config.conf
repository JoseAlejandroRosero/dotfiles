#################################################
#		IMPORTANT NOTES			#
#################################################


#
# - 3 '#' subsections
# - sections separated
# - commented options are default values, uncomment and modify if you wish


#################################################
#		WINDOW EFFECTS			#
#################################################

### BLUR

blur=1
blur_layer=1
blur_optimized=0
blur_params_num_passes = 2
blur_params_radius = 3.5
blur_params_noise = 0.02
blur_params_brightness = 0.8
blur_params_contrast = 0.9
blur_params_saturation = 1.0

### SHADOWS

shadows = 1
layer_shadows = 1
#shadow_only_floating = 1
shadows_size = 8
shadows_blur = 10
shadows_position_x = 5
shadows_position_y = 10
#shadowscolor= 0x000000ff

### BORDER RADIUS AND FOCUS

border_radius=8
#no_radius_when_single=0
#focused_opacity=1.0
unfocused_opacity=0.75

#################################################
#		ANIMATIONS 			#
#################################################

#animations=1
layer_animations=1
animation_type_open=zoom #(zoom,slide,fade,none)
animation_type_close=zoom #(zoom,slide,fade,none)
layer_animation_type_open=fade #(zoom,slide,fade,none)
layer_animation_type_close=fade #(zoom,slide,fade,none)
#animation_fade_in=1
#animation_fade_out=1
tag_animation_direction=0
zoom_initial_ratio=0.4
zoom_end_ratio=0.4
fadein_begin_opacity=0.2
#fadeout_begin_opacity=0.8
animation_duration_move=350
animation_duration_open=300
animation_duration_tag=300
animation_duration_close=500
animation_duration_focus=600
animation_curve_open=1.00,-0.32,0.00,1.31,1
animation_curve_move=0.08,-0.12,0.00,1.31,1
#animation_curve_tag=0.46,1.0,0.29,1
animation_curve_close=1.00,-0.32,0.00,1.31,1
animation_curve_focus=0.56,0.8,0.19,1
animation_curve_opafadein=0.56,0.8,0.19,1
animation_curve_opafadeout=0.46,1.0,0.29,1

#################################################
#		SCROLLER LAYOUT			#
#################################################

scroller_structs=10
scroller_default_proportion=0.75
#scroller_focus_center=0
scroller_prefer_center=1
#scroller_prefer_overspread=1
#edge_scroller_pointer_focus=1
#scroller_ignore_proportion_single=0
scroller_default_proportion_single=1.0
#scroller_proportion_preset=0.5,0.8,1.0

#################################################
#		MASTER STACK LAYOUT 		#
#################################################

#new_is_master=1
#default_mfact=0.55
#default_nmaster=1
smartgaps=1
center_master_overspread=1
center_when_single_stack=0

#################################################
#		OVERVIEW 			#
#################################################

hotarea_size=10
enable_hotarea=1
hotarea_corner=0
#ov_tab_mode=0
overviewgappi=2
overviewgappo=5

#################################################
#		MISCELLANEOUS			#
#################################################

#xwayland_persistence=1
syncobj_enable=1
#allow_shortcuts_inhibit=1 (default)
allow_tearing=2
allow_lock_transparent=1
axis_bind_apply_timeout=50
axis_scroll_factor=0.5
#focus_on_activate=1
#idleinhibit_ignore_visible=0
#sloppyfocus=1
warpcursor=1
drag_corner=4
#drag_warp_cursor=1
focus_cross_monitor=1
exchange_cross_monitor=1
scratchpad_cross_monitor=1
focus_cross_tag=1
#view_current_to_back=1
enable_floating_snap=1
#snap_distance=30
cursor_size=32
cursor_theme=BreezeX-RosePine-Linux
no_border_when_single=0
cursor_time_hideout=15
drag_tile_to_tile=1
single_scratchpad=0

#################################################
#		KEYBOARD			#
#################################################

#repeat_rate=25
repeat_delay=600
#numlockon=0
xkb_rules_layout=us
xkb_rules_variant=altgr-intl

#################################################
#		TRACKPAD			#
#################################################

# need relogin to make it apply
#disable_trackpad=0
#tap_to_click=1
#tap_and_drag=1
#drag_lock=1
#trackpad_natural_scrolling=0
#disable_while_typing=1
#left_handed=0
middle_button_emulation=1
swipe_min_threshold=1
#mouse_natural_scrolling=0
#accel_profile=2
#accel_speed=0.0
scroll_method=2
#click_method=1
send_events_mode=2
button_map=1

#################################################
#		APPEAREANCE			#
#################################################

gappih=10
gappiv=10
gappoh=20
gappov=20
#scratchpad_width_ratio=0.8
#scratchpad_height_ratio=0.9
borderpx=5

## colors generated by matugen
source=~/.config/mango/matugen-colors.conf

## tag, window, layer and monitor rules in separate file
source=~/.config/mango/rules.conf

## environtment settings, will reset every time after config reloaad
source=~/.config/mango/env.conf

## binds for keyboard, mouse and tackpad gestures in separate file
source=~/.config/mango/binds.conf

#################################################
#		AUTOSTART			#
#################################################

exec-once=~/.config/mango/autostart.sh
