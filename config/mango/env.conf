# cursor environtment variables
env=XCURSOR_SIZE,32
env=XCURSOR_THEME,BreezeX-RosePine-Linux

# fcitx5 im; uncomment if needed
#env=GTK_IM_MODULE,fcitx
#env=QT_IM_MODULE,fcitx
#env=SDL_IM_MODULE,fcitx
#env=XMODIFIERS,@im=fcitx
#env=GLFW_IM_MODULE,ibus

# QT THEMING
# this variable is set on my bashrc but can be done here if you want
#env=QT_QPA_PLATFORMTHEME,qt6ct
env=QT_AUTO_SCREEN_SCALE_FACTOR,100
env=QT_WAYLAND_FORCE_DPI,100
env=QT_QPA_PLATFORM,Wayland;xcb

# GTK stuff
env=GTK_USE_PORTAL,1
env=GDK_DEBUG,portals
env=GDK_SCALE,1

# XKB_Default, uncomment for layouts and variants, unless you set them in another way
# env=XKB_DEFAULT_LAYOUT,us,ru
# env=XKB_DEFAULT_VARIANT,colemak_dh_wide_iso,
# env=XKB_DEFAULT_OPTIONS,caps:escape

# wlr-drm option for atomic adjusments
env=WLR_DRM_NO_ATOMIC,1

# ydotool socket
env=YDOTOOL_SOCKET,/tmp/.ydotool_socket

# path
env=PATH,/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:/usr/games:/usr/local/games:/snap/bin:/home/newyorleck/.local/share/.cargo/bin:/home/newyorleck/.local/share/go/bin:/home/newyorleck/.local/bin
