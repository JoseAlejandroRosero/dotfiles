#########################################
#	BASIC KEYBINDINGS		#
#########################################

# key name refer to `xev` or `wev` command output,
# mod keys name: super,ctrl,alt,shift,none

# reload config
bind=SUPER,r,reload_config

# exit mango
bind=SUPER+SHIFT,e,spawn,wlogout

# killing focused client
bind=SUPER,q,killclient,

# switch window status
bind=SUPER,g,toggleglobal,
bind=SUPER,Tab,toggleoverview,
bind=SUPER+SHIFT,space,togglefloating,
bind=SUPER,a,togglemaximizescreen,
bind=SUPER,f,togglefullscreen,
bind=SUPER,i,minimized,
bind=SUPER,o,toggleoverlay,
bind=SUPER+SHIFT,I,restore_minimized
bind=SUPER,z,toggle_scratchpad

# tile/Monocle/Deck layouts zoom and master client control
bind=SUPER+SHIFT,Return,zoom
bind=SUPER,minus,incnmaster,-1
bind=SUPER+SHIFT,plus,incnmaster,+1

# switch layout
bind=SUPER,t,switch_layout

#########################################
#		NAVIGATION		#
#########################################

# switch window focus
bind=SUPER,h,focusdir,left
bind=SUPER,k,focusdir,up
bind=SUPER,j,focusdir,down
bind=SUPER,l,focusdir,right

# swap windows
bind=SUPER+SHIFT,h,exchange_client,left
bind=SUPER+SHIFT,k,exchange_client,up
bind=SUPER+SHIFT,j,exchange_client,down
bind=SUPER+SHIFT,l,exchange_client,right

# adjacent tag switching
bind=SUPER+CTRL,k,viewtoleft
bind=SUPER+CTRL,j,viewtoright
bind=CTRL+SUPER+SHIFT,k,tagtoleft,0
bind=CTRL+SUPER+SHIFT,j,tagtoright,0

# scroller layout
bind=SUPER,bracketright,scroller_stack,right
bind=SUPER,bracketleft,scroller_stack,left

# tag or comboview depends on what you prefer
bind=SUPER,1,comboview,1,0
bind=SUPER,2,comboview,2,0
bind=SUPER,3,comboview,3,0
bind=SUPER,4,comboview,4,0
bind=SUPER,5,comboview,5,0
bind=SUPER,6,comboview,6,0
bind=SUPER,7,comboview,7,0
bind=SUPER,8,comboview,8,0
bind=SUPER,9,comboview,9,0

# tag: move client to the tag and focus it
# tagsilent: move client to the tag and not focus it
bind=SUPER+SHIFT,1,tag,1,0
bind=SUPER+SHIFT,2,tag,2,0
bind=SUPER+SHIFT,3,tag,3,0
bind=SUPER+SHIFT,4,tag,4,0
bind=SUPER+SHIFT,5,tag,5,0
bind=SUPER+SHIFT,6,tag,6,0
bind=SUPER+SHIFT,7,tag,7,0
bind=SUPER+SHIFT,8,tag,8,0
bind=SUPER+SHIFT,9,tag,9,0

# toggleview: toggle the visibility of windows with certain tags
# toggletag: toggle a tag on the focused window
bind=SUPER+CTRL,1,toggletag,1
bind=SUPER+CTRL,2,toggletag,2
bind=SUPER+CTRL,3,toggletag,3
bind=SUPER+CTRL,4,toggletag,4
bind=SUPER+CTRL,5,toggletag,5
bind=SUPER+CTRL,6,toggletag,6
bind=SUPER+CTRL,7,toggletag,7
bind=SUPER+CTRL,8,toggletag,8
bind=SUPER+CTRL,9,toggletag,9

# monitor switch
bind=SUPER+Alt,h,focusmon,left
bind=SUPER+Alt,l,focusmon,right
bind=SUPER+Alt+SHIFT,h,tagmon,left
bind=SUPER+Alt+SHIFT,l,tagmon,right

#########################################
#		APPS			#
#########################################

# menu terminal and file manager, yazi in my case
bind=SUPER,d,spawn,wofi
bind=SUPER,Return,spawn,kitty

# librewolf
bind=SUPER,n,spawn,librewolf

# Named scratchpads for yazi, btop and other apps
bind=SUPER,e,toggle_named_scratchpad,tty-yazi,none,foot -a tty-yazi yazi
bind=SUPER,p,toggle_named_scratchpad,rmpc,none,foot -a rmpc rmpc
bind=SUPER,semicolon,toggle_named_scratchpad,bluetui,none,foot -a bluetui bluetui
bind=SUPER,apostrophe,toggle_named_scratchpad,wiremix,none,foot -a wiremix wiremix
bind=SUPER,slash,toggle_named_scratchpad,btop,none,foot -a btop btop

# toggle  and reload waybar
bind=SUPER,b,spawn,pkill -SIGUSR1 waybar
bind=SUPER+SHIFT,b,spawn_shell,pgrep waybar 2&>1 pkill -SIGUSR2 waybar || waybar

# screenlocker
bind=SUPER+CTRL,s,spawn,hyprlock

# browser and scripts
bind=SUPER,n,spawn,librewolf
bind=SUPER,w,spawn,wallpaper-menu
bind=SUPER+SHIFT,s,spawn,screenshot-menu

# ricing stuff lmao
# conky panel 
bind=SUPER,c,spawn_shell,pgrep conky > /dev/null 2>&1 && killall conky || conky -d
# mouse gestures
bind=SUPER,space,spawn,hexecute
# gaps
bind=SUPER+SHIFT,t,togglegaps
# wf-recorder
bind=SUPER+CTRL,r,spawn_shell,record_screen &
# hyprpicker
bind=SUPER+CTRL,p,spawn_shell,hyprpicker | wl-copy

#########################################
#	VOLUME AND BACKLIGHT		#
#########################################

# volume keys, they work through screen locking because of the l flag
bindl=NONE,XF86AudioRaiseVolume,spawn_shell,wpctl set-volume @DEFAULT_SINK@ 3%+
bindl=NONE,XF86AudioLowerVolume,spawn_shell,wpctl set-volume @DEFAULT_SINK@ 3%-

bindl=NONE,XF86AudioMute,spawn_shell,wpctl set-mute @DEFAULT_SINK@ toggle

# Media keys, mpd gets controlled by playerctl by mpDris2, also work through lock screens through l flag
bindl=NONE,XF86AudioPrev,spawn,playerctl previous
bindl=NONE,XF86AudioPlay,spawn,playerctl play-pause
bindl=NONE,XF86AudioNext,spawn,playerctl next

# Brightness controll through brigthnessctl
bind=NONE,XF86MonBrightnessDown,spawn,brightness-osd --dec
bind=NONE,XF86MonBrightnessUp,spawn,brightness-osd --inc
bind=SUPER+CTRL,l,toggle_monitor,eDP-1

#########################################
#	FLOATING MOVE AND RESIZE	#
#########################################

# movewin
bind=SUPER+SHIFT,Up,movewin,+0,-50
bind=SUPER+SHIFT,Down,movewin,+0,+50
bind=SUPER+SHIFT,Left,movewin,-50,+0
bind=SUPER+SHIFT,Right,movewin,+50,+0
# resizewin
bind=SUPER,Up,resizewin,+0,-50
bind=SUPER,Down,resizewin,+0,+50
bind=SUPER,Left,resizewin,-50,+0
bind=SUPER,Right,resizewin,+50,+0

#########################################
#	MOUSE BUTTONS BINDINGS		#
#########################################

# window management
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_middle,togglemaximizescreen,0
mousebind=SUPER,btn_right,moveresize,curresize
mousebind=SUPER+SHIFT,btn_middle,togglefullscreen

# overviewmode
mousebind=NONE,btn_left,toggleoverview,-1
mousebind=NONE,btn_right,killclient,0

#########################################
#	MOUSE AXIS BINDINGS		#
#########################################

# Axis Bindings
axisbind=SUPER,UP,focusstack,next
axisbind=SUPER,DOWN,focusstack,prev
axisbind=SUPER+CTRL,UP,viewtoleft,0
axisbind=SUPER+CTRL,DOWN,viewtoright,0
axisbind=SUPER+SHIFT,UP,tagtoleft
axisbind=SUPER+SHIFT,DOWN,tagtoright
axisbind=SUPER+Alt,UP,tagmon,left
axisbind=SUPER+Alt,DOWN,tagmon,right

#########################################
#	SWITCH BINDINGS		 	#
#########################################

# Switch bindings
switchbind=fold,spawn_shell,wlr-dpms toggle && hyprlock
switchbind=unfold,spawn_shell,wlr-dpms toggle

#########################################
#	GESTURE BINDINGS	 	#
#########################################

gesturebind=SUPER,left,3,toggle_scratchpad
gesturebind=SUPER,right,3,toggle_scratchpad
gesturebind=SUPER,up,3,restore_minimized
gesturebind=SUPER,down,3,minimized
gesturebind=none,up,3,viewtoleft_have_client
gesturebind=none,down,3,viewtoright_have_client
gesturebind=none,left,3,toggleoverview
gesturebind=none,right,3,toggleoverview
