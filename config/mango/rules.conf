#########################################
#		TAG RULES		#
#########################################

# layout support:
# tile,scroller,grid,deck,monocle,center_tile,vertical_tile,vertical_scroller
tagrule=id:1,layout_name:center_tile
tagrule=id:2,layout_name:monocle
tagrule=id:3,layout_name:deck
tagrule=id:4,layout_name:vertical_tile
tagrule=id:5,layout_name:scroller
tagrule=id:6,layout_name:vertical_grid
tagrule=id:7,layout_name:grid
tagrule=id:8,layout_name:tgmix
tagrule=id:9,layout_name:tile

# no hide

#########################################
#		LAYER RULES		#
#########################################

## gtk-layer-shell
layerrule=animation_type_open:slide,animation_type_close:slide,layer_name:gtk-layer-shell

## wofi
layerrule=animation_type_open:slide,animation_type_close:slide,noblur:1,layer_name:wofi

## screenshots (grim + slurp)
layerrule=noblur:1,layer_name:selection

## hexecute
layerrule=noshadow:1,noblur:1,layer_name:hexecute

# swaync-control-center
layerrule=noblur:1,noshadow:1,animation_type_open:slide,animation_type_close:slide,layer_name:swaync-control-center

# swaync-notification-window
layerrule=noblur:1,noshadow:1,layer_name:swaync-notification-window

# mako notifications
#layerrule=animation_type_open:slide,animation_type_close:zoom,noblur:1,noshadow:1,layer_name:notifications

# wlogout
layerrule=noblur:1,animation_type_open:zoom,animation_type_close:slide,layer_name:logout_dialog

#########################################
#		WINDOW RULES		#
#########################################

# use 'mmsg -g -c' and 'mmsg -w -c' to find appid and title of windows
#

## TERMINALS (kitty,st,foot)
# isterm
windowrule=isterm:1,appid:kitty
windowrule=isterm:1,appid:st
windowrule=isterm:1,appid:foot
windowrule=isterm:1,appid:tty-yazi # yazi named scratchpad

## WEV
windowrule=noswallow:1,appid:wev

## STEAM
# friends
windowrule=isfloating:1,allow_csd:1,animation_type_open:slide,animation_type_close:slide,appid:steam,title:Friends

# game mode (tearing)
windowrule=force_tearing:1,allow_csd:1,istagsilent:1,appid:steam_app*
windowrule=force_tearing:1,appid:osu*

## THUNAR
# rename
windowrule=isfloating:1,animation_type_open:slide,animation_type_close:slide,appid:thunar,title:Rename

# file operation progress
windowrule=isfloating:1,animation_type_open:slide,animation_type_close:slide,appid:thunar,allow_csd:1,title:Operation

# hiresTI
windowrule=isfloating:1,animation_type_open:slide,animation_type_close:slide,appid:com.hiresti.player

## XDG-DESKTOP-PORTAL
# open file
windowrule=isfloating:1,animation_type_open:slide,appid:xdg-desktop-portal,allow_csd:1,title:Open

# gtk
windowrule=isfloating:1,animation_type_open:slide,animation_type_close:slide,appid:xdg-desktop-portal-gtk

## KDENLIVE
# kdenlive
windowrule=isfloating:1,animation_type_open:slide,animation_type_close:slide,allow_csd:1,appid:org.kde.kdenlive

## GIMP
# metadata-viewer
windowrule=isfloating:1,animation_type_open:slide,animation_type_close:slide,allow_csd:1,appid:metadata-viewer

## SAFEEYES
windowrule=isfloating:1,isglobal:1,noblur:0,allow_csd:1,isoverlay:1,appid:io.github.slgobinath.SafeEyes

## Network Manager editor
windowrule=isfloating:1,animation_type_open:slide,animation_type_close:fade,allow_csd:1,appid:nm-connection-editor

## xfce-polkit
windowrule=isfloating:1,animation_type_open:slide,animation_type_close:fade,appid:xfce-polkit

## libre office open dialog
windowrule=isfloating:1,animation_type_open:slide,animation_type_close:fade,appid:soffice,title:Open

## vesktop open file
windowrule=isfloating:1,animation_type_open:slide,animation_type_close:fade,appid:vesktop.bin,title:Open File
#windowrule=allow_csd:1,appid:vesktop

### NAMED SCRATCHPADS
##YAZI
windowrule=isnamedscratchpad:1,width:1280,height:800,appid:tty-yazi
##RMPC
windowrule=isnamedscratchpad:1,width:1280,height:800,appid:rmpc
##BLUETUI
windowrule=isnamedscratchpad:1,width:1280,height:800,appid:bluetui
#BTOP
windowrule=isnamedscratchpad:1,width:1900,height:1000,appid:btop
##WIREMIX
windowrule=isnamedscratchpad:1,width:1280,height:800,appid:wiremix

#########################################
#	MONITOR RULES			#
#########################################

## set your monitor rules if you want them to work properly
monitorrule=name:eDP-1,width:1920,height:1080,refresh:144,x:0,y:0,scale:1.0,rr:0,vrr:1,custom:1
