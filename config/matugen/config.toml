[config]
version_check = true
fallback_color = "#e82091"
caching = true

[config.wallpaper]
set = true
command = "awww img --transition-type=random --transition-fps=144 {{image}}"

[templates.rmpc]
input_path = "./templates/Matugen.ron"
output_path = "~/.config/rmpc/themes/Matugen.ron"

#[templates.st]
#input_path = './templates/xrdb'
#output_path = '~/.local/src/st-kitty/.Xresources'
#post_hook = 'xrdb -merge ~/.local/src/st-kitty/.Xresources'

[templates.kitty]
input_path = './templates/kitty-colors.conf'
output_path = '~/.config/kitty/themes/Matugen.conf'
post_hook = "kitty +kitten themes --reload-in=all Matugen"

[templates.pywalfox]
input_path = './templates/pywalfox'
output_path = '~/.cache/wal/colors.json'
post_hook = 'pywalfox update'

[templates.foot]
input_path = './templates/foot.ini'
output_path = '~/.config/foot/Matugen'
#post_hook = 'pidof foot| xargs kill -s USR1'

[templates.conky]
input_path = './templates/conky-colors'
output_path = '~/.config/conky/conky.conf'

[templates.zathura]
input_path = './templates/zathura-colors'
outputh_path = '~/.config/zathura/zathurarc'

[templates.btop]
input_path = './templates/btop.theme'
output_path = '~/.config/btop/themes/matugen.theme'
post_hook = "pgrep btop> /dev/null 2>&1 && pkill -12 btop || echo 'no btop'"

[templates.vexktop]
input_path = './templates/midnight-discord.css'
output_path = '~/.var/app/dev.vencord.Vesktop/config/vesktop/themes/midnight-discord.css'

[templates.cava]
input_path = '~/.config/matugen/templates/cava-colors.ini'
output_path = '~/.config/cava/themes/your-theme'
post_hook = "pgrep cava > /dev/null 2>&1 && pkill -10 cava || echo 'no cava'"

[templates.gtk3]
input_path = './templates/gtk-colors.css'
output_path = '~/.config/gtk-3.0/colors.css'
post_hook = 'gsettings set org.gnome.desktop.interface gtk-theme ""; gsettings set org.gnome.desktop.interface gtk-theme adw-gtk3-{{mode}}'

[templates.gtk4]
input_path = './templates/gtk-colors.css'
output_path = '~/.config/gtk-4.0/colors.css'
post_hook = 'gsettings set org.gnome.desktop.interface gtk-theme ""; gsettings set org.gnome.desktop.interface gtk-theme adw-gtk3-{{mode}}'

[templates.color-scheme]
input_path = './templates/Matugen.colors'
output_path = '~/.local/share/color-schemes/Matugen.colors'

[templates.mango]
input_path = './templates/mango-colors.conf'
output_path = '~/.config/mango/matugen-colors.conf'
post_hook = 'mmsg -d reload_config'

# uncomment to use fuzzel
#[templates.fuzzel]
#input_path = './templates/fuzzel.ini'
#output_path = '~/.config/fuzzel/colors.ini'

[templates.yazi]
input_path = './templates/yazi-theme.toml'
output_path = '~/.config/yazi/theme.toml'

[templates.waybar]
input_path = './templates/colors.css'
output_path = '~/.config/waybar/colors.css'
post_hook = 'pkill -SIGUSR2 waybar'

[templates.wlogout]
input_path = './templates/colors-rgba.css'
output_path = '~/.config/wlogout/colors.css'

# comment to use mako
[templates.swaync]
input_path = './templates/colors-rgba.css'
output_path = '~/.config/swaync/colors.css'
post_hook= 'swaync-client -rs'

# uncomment to use mako
#[templates.mako]
#input_path = './templates/mako'
#output_path = '~/.config/mako/mako-colors'
#post_hook = 'makoctl reload'

[templates.safeeyes]
input_path = './templates/colors.css'
output_path = '~/.config/safeeyes/style/colors.css'

[templates.kvantum_kvconfig]
input_path = './templates/kvantum-colors.kvconfig'
output_path = '~/.config/Kvantum/matugen/matugen.kvconfig'

[templates.kvantum_svg]
input_path = './templates/kvantum-colors.svg'
output_path = '~/.config/Kvantum/matugen/matugen.svg'

[templates.hyprland]
input_path = './templates/hyprland-colors.conf'
output_path = '~/.config/hypr/colors.conf'
