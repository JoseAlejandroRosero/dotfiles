conky.config = {
--==============================================================================

--  Created : 2022/May/12
--  This theme is for conky version 1.10.8 or newer
-- 
--  RASTABAN
--  ( A part of Draco Conky themes pack )
--
--  author  : Closebox73
--  version : 2.4
--  variant : Celcius
--  license : Distributed under the terms of GPLv3

--==============================================================================

-- Size and Position settings --
  alignment = 'top_left',
  gap_x = 20,
  gap_y = 40,
  maximum_width = 250,
  minimum_height = 700,
  minimum_width = 250,
  
-- Text settings --
  use_xft = true,
  override_utf8_locale = true,
  font = 'Maple Mono NFMono:size=2',
  
-- Color Settings --
  default_color = '#ffffff',
  default_outline_color = '#261f16',
  default_shade_color = '#453b29',
  color1 = '#cebdff',
  color2 = '#d2c78f',
  
-- Window Settings --
  background = false,
  border_width = 1,
  draw_borders = false,
  draw_graph_borders = true,
  draw_outline = false,
  draw_shades = false,
  own_window = true,
  own_window_colour = '000000',
  own_window_class = 'Conky',
  own_window_argb_visual = false,
  own_window_type = 'desktop',
  own_window_transparent = true,
  own_window_hints = 'undecorated,below,sticky,skip_taskbar,skip_pager',
  stippled_borders = 0,
  
-- Others --
  cpu_avg_samples = 2,
  net_avg_samples = 2,
  double_buffer = true,
  out_to_console = false,
  out_to_stderr = false,
  out_to_x = false,
  out_to_wayland = true,
  extra_newline = false,
  update_interval = 1,
  uppercase = false,
  use_spacer = 'none',
  short_units = true,
  show_graph_scale = false,
  show_graph_range = false,
}

conky.text = [[
${execi 10 ~/.config/conky/Rastaban/scripts/weather-v2.0.sh}\
${alignc}${font Bebas Neue Book:size=60}${time %H:%M}${font}
${alignc}${voffset 5}${color1}${font Ubuntu Sans Mono:size=13}${time %A, %d %B}${font}
${alignc}${color}${font Maple Mono NFMono:bold:size=13}-----------------------------------
${alignc}${voffset 10}${color1}${font weather icons:size=35}${execi 15 ~/.config/conky/Rastaban/scripts/weather-text-icon}${font}
${alignc}${voffset 20}${color}${font Ubuntu Sans Mono:light:size=10}${execi 600 ~/.config/conky/Rastaban/scripts/greeting.sh}, ${color1}${execi 6000 whoami | sed "s|\<.|\U&|g"}!!
${alignc}${color}The weather in ${color1}${execi 10 cat ~/.cache/weather.json | jq -r '.name' | sed "s|\<.|\U&|g"} ${color}is
${alignc}${color1}${execi 10 cat ~/.cache/weather.json | jq -r '.weather[0].description' | sed "s|\<.|\U&|g"} ${color}with temp ${color1}${execi 120 cat ~/.cache/weather.json | jq '.main.temp' | awk '{print int($1+0.5)}'}°C
${alignc}${color}Humidity ${color1}${execi 10 cat ~/.cache/weather.json | jq '.main.humidity'}% ${color}& Wind speed ${color1}${execi 120 cat ~/.cache/weather.json | jq '.wind.speed'} m/s.
${alignc}${voffset 10}${color}${font Maple Mono NFMono:bold:size=13}-----------------------------------
${voffset 0}${color}${font Ubuntu Sans Mono:bold:size=9}RAM
${offset 0}${color1}${font Bebas Neue Book:size=40}${memperc}%${alignr}${color2}${memgraph 55,130}${font}
${voffset 5}${color}${font Ubuntu Sans Mono:bold:size=9}CPU
${offset 0}${color1}${font Bebas Neue Book:size=40}${cpu cpu0}%${alignr}${color2}${cpugraph cpu0 55,130}${font}
${voffset 5}${color}${font Ubuntu Sans Mono:bold:size=9}NET_UP
${offset 0}${color1}${font Bebas Neue Book:size=40}${totalup wlp9s0}${alignr}${color2}${upspeedgraph wlp9s0 55,130}${font}
${voffset 5}${color}${font Ubuntu Sans Mono:bold:size=9}NET_DOWN
${offset 0}${color1}${font Bebas Neue Book:size=40}${totaldown wlp9s0}${alignr}${color2}${downspeedgraph wlp9s0 55,130}${font}
${alignc}${voffset 10}${color}${font Maple Mono NFMono:bold:size=13}-----------------------------------
${alignc}${voffset -5}${color}${font Ubuntu Sans Mono:size=9}${exec playerctl status}${font}
${alignc}${voffset 5}${color1}${font Ubuntu Sans Mono:bold:size=15}${exec ~/.config/conky/Rastaban/scripts/playerctl.sh}${font}
${alignc}${voffset 5}${color}${font Ubuntu Sans Mono:italic:size=10}--<<(( ${exec playerctl metadata xesam:artist} ))>>--${font}
]]
